version: '3.8'

services:
  # 🚀 Усі автоматизації в одному контейнері:
  # 1. Бот "Канал Автоматизація" (TikTok вогники, автопостинг, планувальник)
  # 2. Бот "Кібер Рижий"
  # 3. Бот "Кібер Саня Туріков"
  automations_master:
    build: .
    container_name: channel_automations_all
    restart: unless-stopped
    command: python run_all_bots.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
      - ./downloads:/app/downloads
      - ./temp:/app/temp

